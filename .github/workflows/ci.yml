name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workboard
          POSTGRES_PASSWORD: workboard
          POSTGRES_DB: work_board_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workboard -d work_board_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://workboard:workboard@localhost:5432/work_board_test?schema=public
      TEST_DATABASE_URL: postgresql://workboard:workboard@localhost:5432/work_board_test?schema=public
      REDIS_URL: redis://localhost:6379
      CORS_ORIGIN: http://localhost:3000
      CACHE_TTL_SECONDS: 60
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter api db:migrate:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
